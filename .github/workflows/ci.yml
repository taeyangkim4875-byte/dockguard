name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 설치
        run: python -m pip install -e ".[dev]"
      - name: 테스트 (커버리지 90% 미만이면 실패)
        run: python -m pytest --cov=dockguard --cov-report=term-missing --cov-fail-under=90

  demo-scripts:
    name: 데모 스크립트 검증 (docs/demo.md 시나리오 2)
    runs-on: ubuntu-latest
    env:
      COLUMNS: "140"
      DIAGNOSE: dockguard diagnose connectivity demo-backend demo-rabbitmq --port 5672 --format json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 설치
        run: python -m pip install ".[docker]"

      - name: 재현 — demo/setup_demo.sh
        run: bash demo/setup_demo.sh

      - name: 진단 1 — 근본 원인은 네트워크 격리
        run: |
          set +e
          $DIAGNOSE > demo-1.json
          test "$?" -eq 1 || { echo "원인을 찾으면 종료 코드 1이어야 한다"; exit 1; }
          set -e
          python tests/e2e/check_diagnosis.py demo-1.json --expect isolated --networks demo-net-app,demo-net-mq

      - name: 진단 2 — 네트워크 연결 후, 접속 주소 문제가 근본 원인으로 올라오는지
        run: |
          docker network connect demo-net-mq demo-backend
          set +e
          $DIAGNOSE > demo-2.json
          set -e
          python tests/e2e/check_diagnosis.py demo-2.json --expect address

      - name: 진단 3 — 주소까지 고치면 네트워크 레벨 원인 없음
        run: |
          docker rm -f demo-backend
          docker run -d --name demo-backend --network demo-net-mq --restart unless-stopped \
            -e RABBITMQ_HOST=demo-rabbitmq -e RABBITMQ_PORT=5672 alpine:3.20 sleep 3600
          $DIAGNOSE > demo-3.json
          python tests/e2e/check_diagnosis.py demo-3.json --expect connected

      - name: 터미널 출력 (로그 확인용)
        run: dockguard diagnose connectivity demo-backend demo-rabbitmq --port 5672 || true

      - name: 정리 — demo/cleanup_demo.sh
        if: always()
        run: |
          bash demo/cleanup_demo.sh
          test -z "$(docker ps -aq --filter name=demo-)" || { echo "데모 컨테이너가 남았다"; exit 1; }

  e2e-docker:
    name: 실제 Docker로 정전 사고 재현 (E2E)
    runs-on: ubuntu-latest
    env:
      COLUMNS: "140"
      DEPS: examples/rabbitmq-incident/dependencies.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 설치 (일반 설치 — 서버와 같은 방식)
        run: python -m pip install ".[docker]"

      - name: 사고 상태 재현
        run: bash examples/rabbitmq-incident/reproduce.sh

      - name: 진단 — Docker SDK 경로
        run: |
          dockguard scan -c network --deps "$DEPS" -o sdk.json
          python tests/e2e/check_incident.py sdk.json --expect broken --source "Docker SDK"

      - name: 진단 — docker CLI 폴백 경로 (SDK 제거)
        run: |
          python -m pip uninstall -y docker
          dockguard scan -c network --deps "$DEPS" -o cli.json
          python tests/e2e/check_incident.py cli.json --expect broken --source "docker CLI"

      - name: 터미널 출력 (로그 확인용)
        run: dockguard scan -c network --deps "$DEPS" --explain

      - name: --fail-on critical은 종료 코드 1이어야 함
        run: |
          set +e
          dockguard scan -c network --deps "$DEPS" --fail-on critical > /dev/null
          code=$?
          echo "종료 코드: $code"
          test "$code" -eq 1

      - name: 원인 진단 (diagnose) — 근본 원인이 네트워크 격리인지
        run: |
          set +e
          dockguard diagnose connectivity backend-container rabbitmq --port 5672 --format json > diagnosis.json
          code=$?
          set -e
          echo "종료 코드: $code (원인 발견 시 1)"
          test "$code" -eq 1
          python tests/e2e/check_diagnosis.py diagnosis.json --expect isolated
          dockguard diagnose connectivity backend-container rabbitmq --port 5672 || true

      - name: 원인 진단 — 없는 컨테이너도 크래시하지 않아야 함
        run: |
          set +e
          dockguard diagnose connectivity backend-container nope --port 5672
          test "$?" -eq 1

      - name: 복구 후 재진단 — 모든 의존성 통과
        run: |
          docker network connect messaging_mq-net backend-container
          docker start messaging-redis-1
          dockguard scan -c network --deps "$DEPS" -o recovered.json
          python tests/e2e/check_incident.py recovered.json --expect recovered
          dockguard diagnose connectivity backend-container rabbitmq --port 5672 --format json > recovered-diagnosis.json
          python tests/e2e/check_diagnosis.py recovered-diagnosis.json --expect connected

      - name: daemon 점검 · 수정 미리보기 (러너의 실제 /etc/docker/daemon.json)
        run: |
          cat /etc/docker/daemon.json || echo "(daemon.json 없음)"
          dockguard scan -c daemon
          dockguard fix daemon

      - name: 전체 진단 HTML 리포트
        run: dockguard scan --deps "$DEPS" -o dockguard-report.html

      - uses: actions/upload-artifact@v7
        with:
          name: dockguard-e2e-reports
          path: |
            dockguard-report.html
            *.json

      - name: 정리
        if: always()
        run: bash examples/rabbitmq-incident/cleanup.sh
